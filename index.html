<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🎮 Game Hub</title>
  <link rel="stylesheet" href="shared/theme.css"/>
  <style>
    .hub-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }
    .hub-header {
      text-align: center;
      margin-bottom: 50px;
      animation: fade-in-up .6s both;
    }
    .hub-header h1 {
      font-size: clamp(40px, 8vw, 72px);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.1;
      background: linear-gradient(135deg, #f5c542, #e94560);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hub-header p {
      color: var(--text2);
      font-size: 18px;
      margin-top: 12px;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .game-card {
      background: var(--panel);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      animation: fade-in-up .5s both;
      text-decoration: none;
      display: block;
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border-color: rgba(255,255,255,0.18);
    }
    .game-card:nth-child(2) { animation-delay: .1s; }
    .game-card:nth-child(3) { animation-delay: .2s; }
    .game-card:nth-child(4) { animation-delay: .3s; }
    .game-card-banner {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      position: relative;
      overflow: hidden;
    }
    .game-card-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, var(--panel));
    }
    .game-card-body {
      padding: 16px 22px 22px;
    }
    .game-card-body h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .game-card-body p {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .badge-green  { background: rgba(46,204,113,0.2); color: #2ecc71; }
    .badge-yellow { background: rgba(245,197,66,0.2); color: #f5c542; }
    .badge-red    { background: rgba(233,69,96,0.2);  color: #e94560; }
    .badge-blue   { background: rgba(52,152,219,0.2); color: #3498db; }
    .badge-gray   { background: rgba(255,255,255,0.08); color: var(--text2); }
    .coming-soon-overlay {
      position: absolute;
      inset: 0;
      background: rgba(13,13,26,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text2);
      letter-spacing: 1px;
    }
    /* Pixel effect preview */
    .pixel-preview {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      padding: 16px;
      opacity: 0.7;
    }
    .pixel-preview span {
      aspect-ratio: 1;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="hub-container">
    <header class="hub-header">
      <h1>🎮 Game Hub</h1>
      <p>現場活動遊戲合集 · 大螢幕投影優化</p>
    </header>

    <div class="game-grid">

      <!-- Image Guess -->
      <a href="image-guess/index.html" class="game-card">
        <div class="game-card-banner" style="background: linear-gradient(135deg,#1a1a2e,#16213e);">
          <span>🖼️</span>
        </div>
        <div class="game-card-body">
          <h2>看圖估字</h2>
          <p>睇圖片估答案，考眼力同反應！多隊競技，即時計分。</p>
          <div class="badge-row">
            <span class="badge badge-green">✅ 已完成</span>
            <span class="badge badge-yellow">多隊</span>
            <span class="badge badge-blue">限時模式</span>
          </div>
        </div>
      </a>

      <!-- Pixel Guess -->
      <a href="pixel-guess/index.html" class="game-card">
        <div class="game-card-banner" style="background: linear-gradient(135deg,#0f3460,#533483);">
          <span>🔍</span>
        </div>
        <div class="game-card-body">
          <h2>像素猜圖</h2>
          <p>圖片由模糊像素慢慢變清晰——越快答中得分越高！</p>
          <div class="badge-row">
            <span class="badge badge-green">✅ 新遊戲</span>
            <span class="badge badge-red">搶答</span>
            <span class="badge badge-yellow">加速分</span>
          </div>
        </div>
      </a>

      <!-- Music Guess -->
      <div class="game-card" style="position:relative; cursor:default;">
        <div class="game-card-banner" style="background: linear-gradient(135deg,#1a0f2e,#3d1a4e);">
          <span>🎵</span>
        </div>
        <div class="game-card-body">
          <h2>估歌名</h2>
          <p>播音樂片段，搶先估中歌名得分！支援 YouTube / 本地音訊。</p>
          <div class="badge-row">
            <span class="badge badge-gray">📋 計劃中</span>
          </div>
        </div>
        <div class="coming-soon-overlay">🔒 Coming Soon</div>
      </div>

      <!-- TV Game -->
      <div class="game-card" style="position:relative; cursor:default;">
        <div class="game-card-banner" style="background: linear-gradient(135deg,#0a1628,#1e3a5f);">
          <span>📺</span>
        </div>
        <div class="game-card-body">
          <h2>大電視 Quiz</h2>
          <p>Kahoot 風格多選題，即時顯示答題分佈同排行榜。</p>
          <div class="badge-row">
            <span class="badge badge-gray">📋 計劃中</span>
          </div>
        </div>
        <div class="coming-soon-overlay">🔒 Coming Soon</div>
      </div>

    </div>
  </div>
</body>
</html>
