<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>🎮 Quiz Player</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0d0d1a;--panel:#1a1a2e;--panel2:#16213e;--primary:#f5c542;--primary2:#e0a800;--accent:#e94560;--green:#2ecc71;--text:#fff;--text2:#b0b0c3;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden;}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
.hidden{display:none!important;}

/* ── JOIN ── */
.logo{font-size:48px;margin-bottom:6px;}
.logo-title{font-family:'Rubik',sans-serif;font-size:28px;font-weight:900;background:linear-gradient(135deg,#a29bfe,#f5c542);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
.logo-sub{font-size:14px;color:var(--text2);margin-bottom:24px;}
.join-field{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 18px;color:var(--text);font-family:'Rubik',sans-serif;font-size:24px;font-weight:700;text-align:center;letter-spacing:5px;width:100%;max-width:280px;outline:none;margin-bottom:10px;-webkit-appearance:none;}
.join-field:focus{border-color:var(--primary);}
.join-field::placeholder{color:rgba(255,255,255,.25);letter-spacing:2px;font-size:18px;}
.name-field{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 18px;color:var(--text);font-family:'Nunito',sans-serif;font-size:18px;text-align:center;width:100%;max-width:280px;outline:none;margin-bottom:14px;-webkit-appearance:none;}
.name-field:focus{border-color:var(--primary);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 32px;font-family:'Rubik',sans-serif;font-size:18px;font-weight:700;border:none;border-radius:14px;cursor:pointer;transition:transform .15s;width:100%;max-width:280px;}
.btn:active{transform:scale(.96);}
.btn-p{background:var(--primary);color:#1a1a00;box-shadow:0 5px 0 var(--primary2);}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.err{font-size:13px;color:var(--accent);margin-top:6px;min-height:18px;}

/* ── WAITING ── */
.wait-icon{font-size:56px;margin-bottom:12px;animation:bounce 1.5s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
.wait-title{font-family:'Rubik',sans-serif;font-size:24px;font-weight:900;margin-bottom:6px;}
.wait-name{font-family:'Rubik',sans-serif;font-size:18px;color:var(--primary);font-weight:700;margin-bottom:6px;}
.wait-sub{font-size:14px;color:var(--text2);}

/* ── QUESTION ── */
#screen-question{justify-content:flex-start;padding:12px 14px;overflow-y:auto;}
.q-header{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.q-progress-bar{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin:0 10px;overflow:hidden;}
.q-progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .4s;}
.q-num{font-size:13px;font-weight:700;color:var(--text2);}
.timer-wrap{text-align:center;margin:6px 0 10px;}
.timer-num{font-family:'Rubik',sans-serif;font-size:44px;font-weight:900;line-height:1;transition:color .3s;}
.timer-num.warn{color:var(--accent);animation:tw .5s infinite;}
@keyframes tw{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.q-text-box{background:var(--panel);border-radius:16px;border:1px solid rgba(255,255,255,.07);padding:14px 16px;width:100%;margin-bottom:10px;}
.q-text-zh{font-family:'Rubik',sans-serif;font-size:clamp(15px,4.5vw,21px);font-weight:900;line-height:1.3;margin-bottom:3px;}
.q-text-th{font-size:clamp(12px,3.5vw,16px);color:var(--text2);line-height:1.4;}

/* ── ANSWER GRID — 2×2 big buttons ── */
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
.ans-btn{
  border-radius:16px;border:none;
  padding:14px 10px;
  display:flex;align-items:center;justify-content:flex-start;
  gap:10px;
  font-family:'Rubik',sans-serif;font-weight:700;
  cursor:pointer;
  transition:transform .12s,filter .2s,box-shadow .15s;
  min-height:74px;
  -webkit-tap-highlight-color:transparent;
  text-align:left;
  position:relative;overflow:hidden;
}
.ans-btn:active{transform:scale(.94);}
.ans-btn[data-opt="A"]{background:#e74c3c;color:#fff;box-shadow:0 5px 0 #b03627;}
.ans-btn[data-opt="B"]{background:#3498db;color:#fff;box-shadow:0 5px 0 #1f6fa1;}
.ans-btn[data-opt="C"]{background:#2ecc71;color:#1a3a00;box-shadow:0 5px 0 #1f8f4d;}
.ans-btn[data-opt="D"]{background:#f39c12;color:#3a2000;box-shadow:0 5px 0 #b06e07;}

/* Fix 1: SVG icon — fixed container, all same rendered size */
.ans-icon{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ans-icon svg{width:32px;height:32px;display:block;}

.ans-text-wrap{flex:1;min-width:0;}
.ans-zh{font-size:clamp(13px,3.8vw,16px);font-weight:900;line-height:1.25;word-break:break-word;}
.ans-th{font-size:clamp(11px,3vw,13px);opacity:.8;font-weight:700;display:block;margin-top:2px;}

/* Selected state */
.ans-btn.selected{
  transform:scale(.96);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.8), 0 2px 0 rgba(0,0,0,.3) !important;
}
/* Locked after answer submitted or timer done */
.ans-btn.locked{pointer-events:none;cursor:default;}
/* Correct / wrong reveal on player side */
.ans-btn.reveal-correct{border:3px solid #fff;filter:none;animation:correctPop .5s;}
.ans-btn.reveal-wrong{filter:brightness(.38);}
@keyframes correctPop{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}

/* ── ANSWERED WAITING ── */
#screen-answered{padding:28px;}
.ans-result-icon{font-size:72px;margin-bottom:10px;}
.ans-result-label{font-family:'Rubik',sans-serif;font-size:22px;font-weight:900;margin-bottom:8px;}
.ans-pts-gained{font-family:'Rubik',sans-serif;font-size:40px;font-weight:900;color:var(--primary);margin-bottom:6px;}
.ans-total-score{font-size:15px;color:var(--text2);}
.wait-next{font-size:13px;color:var(--text2);margin-top:14px;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ── END ── */
#screen-end{padding:28px;}
.end-medal{font-size:64px;margin-bottom:8px;}
.end-rank-label{font-family:'Rubik',sans-serif;font-size:18px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.end-score{font-family:'Rubik',sans-serif;font-size:52px;font-weight:900;color:var(--primary);margin-bottom:12px;line-height:1;}
.end-thanks{font-size:14px;color:var(--text2);}
</style>
</head>
<body>

<!-- ── JOIN ── -->
<div class="screen" id="screen-join">
  <div class="logo">🎮</div>
  <div class="logo-title">Quiz Game</div>
  <div class="logo-sub">Enter PIN to join</div>
  <input class="join-field" id="pin-input" type="tel" inputmode="numeric"
    maxlength="6" placeholder="PIN" autocomplete="off"/>
  <input class="name-field" id="name-input" type="text"
    maxlength="16" placeholder="Your name" autocomplete="off"/>
  <button class="btn btn-p" id="btn-join">Join Game</button>
  <div class="err" id="join-err"></div>
</div>

<!-- ── WAITING ── -->
<div class="screen hidden" id="screen-waiting">
  <div class="wait-icon">⏳</div>
  <div class="wait-title">Waiting for host…</div>
  <div class="wait-name" id="wait-name"></div>
  <div class="wait-sub">Get ready!</div>
</div>

<!-- ── QUESTION ── -->
<div class="screen hidden" id="screen-question">
  <div class="q-header">
    <span class="q-num" id="q-num">1/10</span>
    <div class="q-progress-bar">
      <div class="q-progress-fill" id="q-prog" style="width:0%"></div>
    </div>
    <span class="q-num" id="q-cat"></span>
  </div>
  <div class="timer-wrap">
    <div class="timer-num" id="timer-num">20</div>
  </div>
  <div class="q-text-box">
    <div class="q-text-zh" id="p-q-zh"></div>
    <div class="q-text-th" id="p-q-th"></div>
  </div>
  <div class="ans-grid" id="p-ans-grid"></div>
</div>

<!-- ── ANSWERED WAITING ── -->
<div class="screen hidden" id="screen-answered">
  <div class="ans-result-icon" id="ans-icon">✅</div>
  <div class="ans-result-label" id="ans-label">Correct!</div>
  <div class="ans-pts-gained" id="ans-pts">+1 200</div>
  <div class="ans-total-score" id="ans-total">Total: 1 200</div>
  <div class="wait-next">Waiting for next question…</div>
</div>

<!-- ── END ── -->
<div class="screen hidden" id="screen-end">
  <div class="end-medal" id="end-medal">🎉</div>
  <div class="end-rank-label" id="end-rank">You finished!</div>
  <div class="end-score" id="end-score">0</div>
  <div class="end-thanks">Thanks for playing!</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update, push, off }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Firebase ──
const FB = {
  apiKey:"AIzaSyB-gMIHU72nzKVzPd-M_Vu3Ahv7bjrQldY",
  authDomain:"gamehub-7c512.firebaseapp.com",
  databaseURL:"https://gamehub-7c512-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"gamehub-7c512",
  storageBucket:"gamehub-7c512.firebasestorage.app",
  messagingSenderId:"258324779724",
  appId:"1:258324779724:web:46dc5fb5f85720ca982869"
};
const app = initializeApp(FB);
const db  = getDatabase(app);

// Fix 1: SVG icons — equal visual weight regardless of shape
// All SVGs rendered at 32×32, stroke=none, fills match tile text colour
const OPT_SVG = {
  A:`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><polygon points="16,3 29,29 3,29" fill="rgba(255,255,255,.9)" stroke="none"/></svg>`,
  B:`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="13" fill="rgba(255,255,255,.9)"/></svg>`,
  C:`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><polygon points="16,3 29,16 16,29 3,16" fill="rgba(255,255,255,.9)" stroke="none"/></svg>`,
  D:`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="26" height="26" rx="4" fill="rgba(255,255,255,.9)"/></svg>`,
};
// For C (green) and D (yellow) — dark fill so icon contrasts with dark text colour
const OPT_SVG_DARK = {
  C:`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><polygon points="16,3 29,16 16,29 3,16" fill="rgba(0,0,0,.25)" stroke="none"/></svg>`,
  D:`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="26" height="26" rx="4" fill="rgba(0,0,0,.2)"/></svg>`,
};

// ── State ──
let PIN='', myUID='', myName='', myScore=0;
let gameRef=null;
let qWatcher=null, statusWatcher=null;
let timerInt=null, timerLeft=0;
let hasAnswered=false, myAnswer='';
let lastQIdx=-1; // prevent re-rendering same question

// ── Pre-fill PIN from URL ──
const urlPin = new URLSearchParams(location.search).get('pin');
if (urlPin) document.getElementById('pin-input').value = urlPin;
setTimeout(() => {
  const nameInput = document.getElementById('name-input');
  if (urlPin) nameInput.focus();
  else document.getElementById('pin-input').focus();
}, 300);

// ── JOIN ──
document.getElementById('btn-join').addEventListener('click', joinGame);
document.getElementById('name-input').addEventListener('keydown', e => { if(e.key==='Enter') joinGame(); });
document.getElementById('pin-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('name-input').focus(); });

async function joinGame() {
  const pin  = document.getElementById('pin-input').value.trim();
  const name = document.getElementById('name-input').value.trim();
  const err  = document.getElementById('join-err');
  err.textContent = '';

  if (pin.length !== 6) { err.textContent = 'Enter a 6-digit PIN'; return; }
  if (!name)             { err.textContent = 'Enter your name'; return; }

  document.getElementById('btn-join').disabled = true;
  document.getElementById('btn-join').textContent = 'Joining…';

  try {
    const snap = await get(ref(db, 'games/'+pin));
    if (!snap.exists()) { throw new Error('Game not found. Check PIN.'); }
    const status = snap.val()?.status;
    if (status === 'ended') { throw new Error('This game has already ended.'); }

    PIN = pin; myName = name;
    gameRef = ref(db, 'games/'+PIN);

    // Register player with unique ID
    const pRef = push(ref(db, 'games/'+PIN+'/players'));
    myUID = pRef.key;
    await set(pRef, { name, score:0 });

    showScreen('waiting');
    document.getElementById('wait-name').textContent = name;
    watchGame();

  } catch(e) {
    err.textContent = e.message;
    document.getElementById('btn-join').disabled = false;
    document.getElementById('btn-join').textContent = 'Join Game';
  }
}

// ── WATCH GAME STATE ──
function watchGame() {
  // Watch question data
  qWatcher = ref(db, 'games/'+PIN+'/questionData');
  onValue(qWatcher, snap => {
    const qd = snap.val();
    if (!qd) return;

    if (qd.status === 'answering') {
      // Only render if it's a new question (different idx)
      if (qd.idx !== lastQIdx) {
        lastQIdx = qd.idx;
        hasAnswered = false;
        myAnswer = '';
        showQuestion(qd);
      }
    } else if (qd.status === 'revealed') {
      // Show result on player's screen
      handleReveal(qd);
    }
  });

  // Watch game status for end
  statusWatcher = ref(db, 'games/'+PIN+'/status');
  onValue(statusWatcher, snap => {
    if (snap.val() === 'ended') showEnd();
  });
}

// ── SHOW QUESTION ──
function showQuestion(qd) {
  clearInterval(timerInt);
  showScreen('question');

  document.getElementById('q-num').textContent = `${qd.idx+1}/${qd.total}`;
  document.getElementById('q-prog').style.width = ((qd.idx/qd.total)*100)+'%';
  document.getElementById('q-cat').textContent  = qd.category || '';
  document.getElementById('p-q-zh').textContent = qd.qZH || '';
  document.getElementById('p-q-th').textContent = qd.qTH || '';

  // Answer buttons with matching SVG icons
  const grid = document.getElementById('p-ans-grid');
  grid.innerHTML = ['A','B','C','D'].map(o => {
    const zh = qd[o.toLowerCase()+'ZH'] || '';
    const th = qd[o.toLowerCase()+'TH'] || '';
    const svgHtml = (o==='C'||o==='D') ? OPT_SVG_DARK[o] : OPT_SVG[o];
    return `<button class="ans-btn" data-opt="${o}">
      <span class="ans-icon">${svgHtml}</span>
      <span class="ans-text-wrap">
        <span class="ans-zh">${zh}</span>
        ${th ? `<span class="ans-th">${th}</span>` : ''}
      </span>
    </button>`;
  }).join('');

  // Attach click handlers
  grid.querySelectorAll('.ans-btn').forEach(btn => {
    btn.addEventListener('click', () => submitAnswer(btn.dataset.opt, btn));
  });

  // Sync timer: use server timerEnd so all players see same countdown
  const secLeft = Math.max(1, Math.round((qd.timerEnd - Date.now()) / 1000));
  startTimer(secLeft);
}

// ── TIMER ──
function startTimer(sec) {
  clearInterval(timerInt);
  timerLeft = sec;
  const el = document.getElementById('timer-num');
  el.textContent = timerLeft;
  el.className = 'timer-num';
  timerInt = setInterval(() => {
    timerLeft--;
    el.textContent = Math.max(0, timerLeft);
    if (timerLeft <= 5) el.classList.add('warn');
    if (timerLeft <= 0) {
      clearInterval(timerInt);
      // Lock all buttons — time's up
      lockButtons();
    }
  }, 1000);
}

function lockButtons() {
  document.querySelectorAll('.ans-btn').forEach(b => b.classList.add('locked'));
}

// ── SUBMIT ANSWER ──
function submitAnswer(opt, btn) {
  if (hasAnswered) return;
  hasAnswered = true;
  myAnswer = opt;
  clearInterval(timerInt);

  // Visual: mark selected, lock others
  document.querySelectorAll('.ans-btn').forEach(b => {
    b.classList.add('locked');
    if (b.dataset.opt === opt) b.classList.add('selected');
  });

  // Write to Firebase: key = myUID so host can look up by player
  set(ref(db, 'games/'+PIN+'/answers/'+myUID), opt);
}

// ── HANDLE REVEAL (host showed answer) ──
function handleReveal(qd) {
  clearInterval(timerInt);
  const correct = qd.answer;
  if (!correct) return; // answer not yet set (shouldn't happen)

  if (hasAnswered && myAnswer) {
    // Show correct/wrong on the answer buttons briefly
    const grid = document.getElementById('p-ans-grid');
    if (grid.children.length > 0) {
      // We're still on question screen — animate then switch
      grid.querySelectorAll('.ans-btn').forEach(b => {
        b.classList.add('locked');
        if (b.dataset.opt === correct) b.classList.add('reveal-correct');
        else b.classList.add('reveal-wrong');
      });
      setTimeout(() => showResult(correct), 900);
    } else {
      showResult(correct);
    }
  } else {
    // Didn't answer in time
    showResult(correct);
  }
}

// ── SHOW RESULT SCREEN ──
function showResult(correct) {
  const isCorrect  = hasAnswered && myAnswer === correct;
  const isAnswered = hasAnswered && myAnswer !== '';

  // Refresh score
  get(ref(db, 'games/'+PIN+'/players/'+myUID)).then(snap => {
    myScore = snap.val()?.score || 0;

    document.getElementById('ans-icon').textContent  = !isAnswered ? '⏱️' : isCorrect ? '✅' : '❌';
    document.getElementById('ans-label').textContent  = !isAnswered ? "Time's up!" : isCorrect ? 'Correct!' : 'Wrong!';

    if (isCorrect) {
      document.getElementById('ans-pts').textContent  = '+' + myScore.toLocaleString();
      document.getElementById('ans-pts').style.color  = 'var(--primary)';
    } else {
      document.getElementById('ans-pts').textContent  = isAnswered ? 'No points' : 'Timed out';
      document.getElementById('ans-pts').style.color  = 'var(--text2)';
    }
    document.getElementById('ans-total').textContent  = 'Total: ' + myScore.toLocaleString() + ' pts';
    showScreen('answered');
  });
}

// ── END ──
function showEnd() {
  clearInterval(timerInt);
  if (qWatcher)     off(qWatcher);
  if (statusWatcher) off(statusWatcher);

  get(ref(db, 'games/'+PIN+'/players')).then(snap => {
    const all = snap.val() || {};
    const sorted = Object.entries(all)
      .sort(([,a],[,b]) => (b.score||0) - (a.score||0));
    const rank = sorted.findIndex(([uid]) => uid === myUID) + 1;
    const total = sorted.length;
    const medals = {1:'🥇', 2:'🥈', 3:'🥉'};
    const finalScore = all[myUID]?.score || myScore;

    document.getElementById('end-medal').textContent    = medals[rank] || '🎮';
    document.getElementById('end-rank').textContent     = `#${rank} of ${total}`;
    document.getElementById('end-score').textContent    = finalScore.toLocaleString() + ' pts';
    showScreen('end');
  });
}

// ── UTILS ──
function showScreen(n) {
  ['join','waiting','question','answered','end'].forEach(s => {
    document.getElementById('screen-'+s).classList.toggle('hidden', s !== n);
  });
}
</script>
</body>
</html>
