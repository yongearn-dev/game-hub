<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🖼️ 看圖估字</title>
  <link rel="stylesheet" href="../shared/theme.css"/>
  <style>
    .ig-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      position: relative;
      z-index: 1;
    }

    /* Setup */
    .ig-header { text-align:center; padding:24px 0 28px; animation: fade-in-up .5s; }
    .ig-header h1 {
      font-size: clamp(32px,6vw,52px); font-weight:900;
      background: linear-gradient(135deg,#f5c542,#e94560);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .ig-header p { color:var(--text2); margin-top:8px; }
    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px; margin-bottom:20px;
    }
    @media(max-width:600px){.setup-grid{grid-template-columns:1fr;}}
    .setup-section {
      background:var(--panel); border-radius:18px;
      border:1px solid rgba(255,255,255,0.07);
      padding:18px 20px;
    }
    .setup-section h3 {
      font-size:13px; font-weight:700; text-transform:uppercase;
      letter-spacing:1px; color:var(--text2); margin-bottom:12px;
    }
    .option-row { display:flex; flex-wrap:wrap; gap:8px; }
    .option-pill {
      padding:7px 14px; border-radius:50px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      cursor:pointer; font-size:14px; font-weight:700;
      transition:all .15s; color:var(--text2);
    }
    .option-pill.selected { background:var(--primary); color:#1a1a00; border-color:var(--primary); }
    .option-pill:hover:not(.selected) { background:rgba(255,255,255,0.12); color:var(--text); }
    .team-inputs { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
    .team-input-row { display:flex; align-items:center; gap:10px; }
    .team-color-dot { width:14px;height:14px;border-radius:50%;flex-shrink:0; }
    .team-name-input {
      flex:1; background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:8px; padding:8px 12px;
      color:var(--text); font-family:'Nunito',sans-serif;
      font-size:15px; outline:none; transition:border-color .15s;
    }
    .team-name-input:focus{border-color:var(--primary);}
    .cta-row{display:flex;gap:12px;justify-content:center;margin-top:4px;}

    /* Game screen */
    #screen-game{display:none;}
    .game-header{text-align:center;margin-bottom:16px;}
    .score-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}

    /* Image row */
    .image-equation {
      display:flex; align-items:center; justify-content:center;
      flex-wrap:wrap; gap:10px;
      background:var(--panel); border-radius:20px;
      padding:20px; margin-bottom:16px;
      border:1px solid rgba(255,255,255,0.07);
    }
    .image-equation img {
      width:clamp(100px,20vw,150px);
      height:clamp(100px,20vw,150px);
      object-fit:contain; border-radius:12px;
      background:var(--panel2);
    }
    .op-sym {
      font-family:'Rubik',sans-serif;
      font-size:clamp(24px,4vw,36px);
      font-weight:900; color:var(--text2);
    }
    .result-sym {
      font-family:'Rubik',sans-serif;
      font-size:clamp(24px,4vw,36px);
      font-weight:900; color:var(--primary);
    }

    /* Answer + hint */
    .answer-hint-row { display:flex; gap:10px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
    .answer-box {
      font-family:'Rubik',sans-serif;
      font-size:clamp(24px,5vw,42px);
      font-weight:900; color:var(--primary);
      text-align:center;
      background:var(--panel); border-radius:14px;
      padding:14px 28px;
      border:2px solid rgba(245,197,66,0.3);
      animation:correct-pop .4s;
    }
    .hint-box {
      font-size:16px; color:var(--text2);
      background:var(--panel); border-radius:14px;
      padding:12px 20px; text-align:center;
    }

    /* Team scoring buttons (Kahoot style) */
    .team-btns {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:12px; margin:16px 0;
    }
    .team-score-btn {
      padding:18px 12px;
      border-radius:16px; border:none;
      font-family:'Rubik',sans-serif;
      font-size:17px; font-weight:700;
      cursor:pointer;
      transition:transform .15s;
      box-shadow:0 5px 0 rgba(0,0,0,0.3);
      display:flex; align-items:center;
      justify-content:space-between;
    }
    .team-score-btn:hover{transform:translateY(-2px);}
    .team-score-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.3);}
    .team-score-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
    .tsb-pts {
      background:rgba(0,0,0,0.2);
      padding:4px 10px; border-radius:8px;
      font-size:14px;
    }

    .control-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

    /* Progress */
    .q-progress {
      height:4px; background:rgba(255,255,255,0.08);
      border-radius:2px; margin-bottom:12px; overflow:hidden;
    }
    .q-bar {
      height:100%; background:linear-gradient(90deg,#f5c542,#e94560);
      border-radius:2px; transition:width .4s;
    }

    /* End */
    #screen-end{display:none;text-align:center;}
    #screen-end h2 {
      font-size:40px;font-weight:900;margin-bottom:8px;
      background:linear-gradient(135deg,#f5c542,#e94560);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
    }
    #screen-end p{color:var(--text2);margin-bottom:28px;}
  </style>
</head>
<body>
<div class="ig-wrap">

  <!-- SETUP -->
  <div id="screen-setup">
    <div class="ig-header">
      <h1>🖼️ 看圖估字</h1>
      <p>睇圖片估答案，考眼力同反應！</p>
    </div>

    <div class="setup-grid">
      <!-- Language / Group -->
      <div class="setup-section">
        <h3>🌐 語言 &amp; 內容</h3>
        <select id="lang-sel" style="width:100%;padding:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:var(--text);font-size:15px;margin-bottom:10px;outline:none;">
          <option value="">選擇語言</option>
          <option value="zh">中文</option>
          <option value="th">ไทย</option>
        </select>
        <select id="group-sel" disabled style="width:100%;padding:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:var(--text);font-size:15px;margin-bottom:10px;outline:none;">
          <option value="">先選語言</option>
        </select>
        <div id="cat-checks" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>

      <!-- Mode -->
      <div class="setup-section">
        <h3>🎮 遊戲模式</h3>
        <div class="option-row" id="mode-options">
          <div class="option-pill selected" data-val="standard">標準模式</div>
          <div class="option-pill" data-val="timeAttack">Time Attack</div>
        </div>
        <div id="std-opts" style="margin-top:14px;">
          <p style="font-size:13px;color:var(--text2);margin-bottom:8px">每題秒數</p>
          <div class="option-row" id="pq-options">
            <div class="option-pill" data-val="15">15s</div>
            <div class="option-pill" data-val="20">20s</div>
            <div class="option-pill selected" data-val="30">30s</div>
            <div class="option-pill" data-val="45">45s</div>
            <div class="option-pill" data-val="0">無限</div>
          </div>
        </div>
        <div id="ta-opts" style="display:none;margin-top:14px;">
          <p style="font-size:13px;color:var(--text2);margin-bottom:8px">每隊總時間</p>
          <div class="option-row" id="total-time-options">
            <div class="option-pill" data-val="180">3分鐘</div>
            <div class="option-pill selected" data-val="300">5分鐘</div>
            <div class="option-pill" data-val="600">10分鐘</div>
          </div>
        </div>
      </div>

      <!-- Questions -->
      <div class="setup-section">
        <h3>❓ 題數</h3>
        <div class="option-row" id="q-options">
          <div class="option-pill" data-val="5">5</div>
          <div class="option-pill selected" data-val="10">10</div>
          <div class="option-pill" data-val="15">15</div>
          <div class="option-pill" data-val="20">20</div>
        </div>
      </div>

      <!-- Teams -->
      <div class="setup-section">
        <h3>👥 隊伍</h3>
        <div class="option-row" id="team-count-options">
          <div class="option-pill" data-val="1">1</div>
          <div class="option-pill" data-val="2">2</div>
          <div class="option-pill selected" data-val="3">3</div>
          <div class="option-pill" data-val="4">4</div>
          <div class="option-pill" data-val="5">5</div>
          <div class="option-pill" data-val="6">6</div>
        </div>
        <div class="team-inputs" id="team-name-inputs" style="margin-top:14px;"></div>
      </div>
    </div>

    <div class="cta-row">
      <a href="../index.html" class="btn btn-ghost">← 返回</a>
      <button class="btn btn-primary" id="start-btn">▶ 開始遊戲</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="screen-game">
    <div id="hub-timer" class="hub-timer hidden"></div>
    <div class="game-header">
      <div class="q-progress"><div class="q-bar" id="q-bar"></div></div>
      <span id="q-counter" style="color:var(--text2);font-size:14px;font-weight:700;"></span>
    </div>
    <div class="score-bar" id="score-bar"></div>
    <div class="image-equation" id="image-row"></div>
    <div class="answer-hint-row">
      <div class="answer-box hidden" id="answer-box"></div>
      <div class="hint-box hidden" id="hint-box"></div>
    </div>
    <div class="team-btns" id="team-btns"></div>
    <div class="control-row">
      <button class="btn btn-ghost" id="btn-hint">💡 提示 (-1)</button>
      <button class="btn btn-ghost" id="btn-answer">🔓 顯示答案</button>
      <button class="btn btn-primary" id="btn-next">下一題 ▶</button>
    </div>
  </div>

  <!-- END -->
  <div id="screen-end">
    <h2>🎉 遊戲結束！</h2>
    <p>最終排行榜</p>
    <ul class="leaderboard card" id="final-lb" style="max-width:500px;margin:0 auto 28px;padding:20px 24px;"></ul>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn btn-primary" id="btn-replay">🔄 再玩</button>
      <a href="../index.html" class="btn btn-ghost">← 主選單</a>
    </div>
  </div>

</div>
<script type="module" src="script.js"></script>
</body>
</html>
