<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🔍 像素猜圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0d0d1a;--panel:#1a1a2e;--panel2:#16213e;
      --primary:#f5c542;--primary2:#e0a800;
      --accent:#e94560;--accent2:#c73652;
      --green:#2ecc71;--blue:#3498db;--purple:#9b59b6;
      --text:#ffffff;--text2:#b0b0c3;--radius:14px;
    }
    body{
      font-family:'Nunito',sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;overflow-x:hidden;
    }
    .hidden{display:none!important;}
    .pg-wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;position:relative;}

    /* Header */
    .pg-title{text-align:center;padding:24px 0 28px;}
    .pg-title h1{
      font-family:'Rubik',sans-serif;
      font-size:clamp(32px,6vw,52px);font-weight:900;
      background:linear-gradient(135deg,#a29bfe,#e94560);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .pg-title p{color:var(--text2);margin-top:8px;font-size:16px;}

    /* Setup grid */
    .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
    @media(max-width:600px){.setup-grid{grid-template-columns:1fr;}}
    .setup-section{
      background:var(--panel);border-radius:18px;
      border:1px solid rgba(255,255,255,0.07);padding:18px 20px;
    }
    .setup-section h3{
      font-size:13px;font-weight:700;text-transform:uppercase;
      letter-spacing:1px;color:var(--text2);margin-bottom:12px;
    }
    .option-row{display:flex;flex-wrap:wrap;gap:8px;}
    .option-pill{
      padding:7px 14px;border-radius:50px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      cursor:pointer;font-size:14px;font-weight:700;
      transition:all .15s;color:var(--text2);user-select:none;
    }
    .option-pill.sel{background:var(--primary);color:#1a1a00;border-color:var(--primary);}
    .option-pill:hover:not(.sel){background:rgba(255,255,255,0.12);color:var(--text);}

    /* Team inputs */
    .team-inputs{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
    .team-input-row{display:flex;align-items:center;gap:10px;}
    .team-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
    .team-name-input{
      flex:1;background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:8px;padding:8px 12px;
      color:var(--text);font-family:'Nunito',sans-serif;
      font-size:15px;outline:none;transition:border-color .15s;
    }
    .team-name-input:focus{border-color:var(--primary);}

    /* Buttons */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:12px 28px;font-family:'Rubik',sans-serif;
      font-size:17px;font-weight:700;border:none;border-radius:14px;
      cursor:pointer;transition:transform .15s,box-shadow .15s;
    }
    .btn:hover{transform:translateY(-2px);}
    .btn:active{transform:translateY(1px);}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}
    .btn-primary{background:var(--primary);color:#1a1a00;box-shadow:0 5px 0 var(--primary2);}
    .btn-ghost{background:rgba(255,255,255,0.08);color:var(--text);border:1px solid rgba(255,255,255,0.15);}
    .btn-ghost:hover{background:rgba(255,255,255,0.14);}
    .btn-accent{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent2);}
    .cta-row{display:flex;gap:12px;justify-content:center;margin-top:8px;}

    /* Image Upload */
    .img-manager{
      background:var(--panel);border-radius:18px;
      border:1px solid rgba(255,255,255,0.07);padding:18px 20px;margin-bottom:18px;
    }
    .img-manager h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:12px;}
    .drop-zone{
      border:2px dashed rgba(255,255,255,0.2);border-radius:14px;padding:28px;
      text-align:center;cursor:pointer;transition:border-color .2s,background .2s;
      color:var(--text2);font-size:15px;
    }
    .drop-zone:hover,.drop-zone.drag-over{border-color:var(--primary);background:rgba(245,197,66,0.06);color:var(--text);}
    .drop-icon{font-size:36px;display:block;margin-bottom:8px;}
    .image-queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:14px;}
    .img-thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--panel2);cursor:pointer;}
    .img-thumb img{width:100%;height:100%;object-fit:cover;}
    .img-answer{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);font-size:11px;padding:4px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .img-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:0;transition:opacity .15s;z-index:2;}
    .img-thumb:hover .img-remove{opacity:1;}

    /* Answer modal */
    .answer-modal{
      position:fixed;inset:0;background:rgba(0,0,0,.75);
      display:flex;align-items:center;justify-content:center;z-index:9000;
    }
    .answer-modal-box{background:var(--panel);border-radius:20px;padding:24px 28px;width:min(400px,90vw);border:1px solid rgba(255,255,255,.12);}
    .answer-modal-box h3{margin-bottom:10px;font-size:18px;}
    .answer-modal-box img{width:100%;border-radius:10px;margin-bottom:12px;object-fit:contain;max-height:180px;}
    .answer-modal-box input{
      width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
      border-radius:10px;padding:11px 14px;color:var(--text);font-size:17px;
      font-family:'Nunito',sans-serif;outline:none;margin-bottom:12px;display:block;
    }
    .answer-modal-box input:focus{border-color:var(--primary);}
    .modal-btns{display:flex;gap:10px;}

    /* Game screen */
    #screen-game{display:none;}
    .game-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .q-counter{font-size:14px;color:var(--text2);font-weight:700;}
    .reveal-stage{font-family:'Rubik',sans-serif;font-size:13px;font-weight:700;color:var(--primary);background:rgba(245,197,66,.12);padding:4px 12px;border-radius:20px;}

    /* Score chips */
    .score-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
    .score-chip{background:var(--panel2);border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:7px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

    /* Canvas */
    .canvas-wrap{position:relative;display:flex;justify-content:center;margin:0 auto 14px;max-width:600px;}
    #pixel-canvas{width:100%;max-width:600px;border-radius:16px;border:2px solid rgba(255,255,255,.08);display:block;image-rendering:pixelated;}
    .pts-badge{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;font-family:'Rubik',sans-serif;font-weight:900;font-size:20px;padding:6px 14px;border-radius:50px;z-index:5;transition:all .3s;}
    .answer-overlay{position:absolute;inset:0;background:rgba(13,13,26,.85);display:flex;align-items:center;justify-content:center;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .3s;}
    .answer-overlay.show{opacity:1;pointer-events:auto;}
    .answer-text{font-family:'Rubik',sans-serif;font-size:clamp(28px,6vw,52px);font-weight:900;color:var(--primary);text-align:center;padding:20px;animation:pop .5s;}

    /* Progress bar */
    .reveal-progress{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-bottom:14px;overflow:hidden;}
    .reveal-bar{height:100%;background:linear-gradient(90deg,#6c5ce7,#a29bfe);border-radius:3px;width:0%;transition:width .5s;}

    /* Hint */
    .hint-box{text-align:center;color:var(--text2);font-size:15px;margin-bottom:10px;min-height:22px;}

    /* Team buttons */
    .team-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0;}
    .team-score-btn{
      padding:14px 24px;border-radius:50px;border:none;
      font-family:'Rubik',sans-serif;font-size:16px;font-weight:700;
      cursor:pointer;transition:transform .15s;
      box-shadow:0 4px 0 rgba(0,0,0,.3);
    }
    .team-score-btn:hover{transform:translateY(-2px);}
    .team-score-btn:active{transform:translateY(1px);}
    .team-score-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

    /* Control row */
    .control-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

    /* Timer */
    .hub-timer{
      position:fixed;top:16px;right:20px;font-family:'Rubik',sans-serif;
      font-size:48px;font-weight:900;background:var(--panel);color:var(--text);
      padding:8px 20px;border-radius:16px;z-index:999;min-width:110px;text-align:center;
      border:2px solid rgba(255,255,255,.1);
    }
    .hub-timer.warning{color:var(--accent);border-color:var(--accent);animation:pulse .6s infinite;}

    /* End screen */
    #screen-end{display:none;text-align:center;padding-top:20px;}
    #screen-end h2{font-family:'Rubik',sans-serif;font-size:40px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#f5c542,#e94560);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    #screen-end p{color:var(--text2);margin-bottom:24px;}
    .leaderboard{list-style:none;padding:0;max-width:480px;margin:0 auto 28px;background:var(--panel);border-radius:18px;padding:20px 22px;border:1px solid rgba(255,255,255,.07);}
    .leaderboard li{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:5px 0;background:var(--panel2);border-radius:10px;font-size:17px;font-weight:700;}
    .leaderboard li:nth-child(1){background:rgba(245,197,66,.2);border:1px solid var(--primary);}
    .leaderboard li:nth-child(2){background:rgba(180,180,200,.1);}
    .leaderboard li:nth-child(3){background:rgba(205,127,50,.15);}
    .lb-score{margin-left:auto;color:var(--primary);font-size:20px;}

    /* Animations */
    @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes confetti-fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
    @keyframes slide-in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
  </style>
</head>
<body>
<div class="pg-wrap">

  <!-- ===== SETUP ===== -->
  <div id="screen-setup">
    <div class="pg-title">
      <h1>🔍 像素猜圖</h1>
      <p>圖片由模糊像素慢慢變清晰，越快答中得分越高！</p>
    </div>

    <div class="img-manager">
      <h3>📁 圖片庫 <span id="img-count" style="color:var(--primary)">(0 張)</span></h3>
      <div class="drop-zone" id="drop-zone">
        <span class="drop-icon">🖼️</span>
        點擊或拖放圖片到這裡上傳<br>
        <small style="font-size:13px;margin-top:6px;display:block">支援 JPG / PNG / GIF · 每張需填入答案</small>
      </div>
      <input type="file" id="file-input" multiple accept="image/*" style="display:none"/>
      <div class="image-queue" id="image-queue"></div>
    </div>

    <!-- Answer modal -->
    <div class="answer-modal hidden" id="answer-modal">
      <div class="answer-modal-box">
        <h3>📝 輸入答案</h3>
        <img id="modal-preview" src="" alt="preview"/>
        <input type="text" id="modal-answer" placeholder="輸入這張圖的答案…" maxlength="40"/>
        <div class="modal-btns">
          <button class="btn btn-primary" id="modal-confirm" style="flex:1">✅ 確認</button>
          <button class="btn btn-ghost" id="modal-cancel">取消</button>
        </div>
      </div>
    </div>

    <div class="setup-grid">
      <div class="setup-section">
        <h3>⏱ 揭示速度</h3>
        <p style="font-size:13px;color:var(--text2);margin-bottom:8px">揭示步數</p>
        <div class="option-row" id="steps-opts">
          <div class="option-pill" data-val="3">3步</div>
          <div class="option-pill sel" data-val="5">5步</div>
          <div class="option-pill" data-val="8">8步</div>
          <div class="option-pill" data-val="12">12步</div>
        </div>
      </div>
      <div class="setup-section">
        <h3>👥 隊伍數量</h3>
        <div class="option-row" id="team-count-opts">
          <div class="option-pill" data-val="1">1</div>
          <div class="option-pill sel" data-val="2">2</div>
          <div class="option-pill" data-val="3">3</div>
          <div class="option-pill" data-val="4">4</div>
          <div class="option-pill" data-val="5">5</div>
          <div class="option-pill" data-val="6">6</div>
        </div>
        <div class="team-inputs" id="team-name-inputs"></div>
      </div>
      <div class="setup-section">
        <h3>🏆 計分</h3>
        <p style="font-size:13px;color:var(--text2);margin-bottom:8px">滿分（第1步答中）</p>
        <div class="option-row" id="score-opts">
          <div class="option-pill" data-val="5">5分</div>
          <div class="option-pill sel" data-val="10">10分</div>
          <div class="option-pill" data-val="20">20分</div>
        </div>
        <p style="font-size:13px;color:var(--text2);margin:10px 0 8px">每步減</p>
        <div class="option-row" id="deduct-opts">
          <div class="option-pill sel" data-val="1">-1/步</div>
          <div class="option-pill" data-val="2">-2/步</div>
          <div class="option-pill" data-val="0">不減分</div>
        </div>
      </div>
      <div class="setup-section">
        <h3>❓ 題數</h3>
        <div class="option-row" id="q-opts">
          <div class="option-pill" data-val="5">5題</div>
          <div class="option-pill sel" data-val="10">10題</div>
          <div class="option-pill" data-val="15">15題</div>
          <div class="option-pill" data-val="999">全部</div>
        </div>
      </div>
    </div>

    <div class="cta-row">
      <a href="../index.html" class="btn btn-ghost" style="text-decoration:none">← 返回</a>
      <button class="btn btn-primary" id="start-btn" disabled>▶ 開始遊戲</button>
    </div>
  </div>

  <!-- ===== GAME ===== -->
  <div id="screen-game">
    <div id="hub-timer" class="hub-timer hidden"></div>
    <div class="game-top">
      <span class="q-counter" id="q-counter">第 1/10 題</span>
      <span class="reveal-stage" id="reveal-stage">像素 0/5</span>
    </div>
    <div class="score-bar" id="score-bar"></div>
    <div class="canvas-wrap">
      <canvas id="pixel-canvas" width="600" height="450"></canvas>
      <div class="pts-badge" id="pts-badge">+10</div>
      <div class="answer-overlay" id="answer-overlay">
        <div class="answer-text" id="answer-display"></div>
      </div>
    </div>
    <div class="reveal-progress"><div class="reveal-bar" id="reveal-bar"></div></div>
    <div class="hint-box" id="hint-box"></div>
    <div class="team-btns" id="team-btns"></div>
    <div class="control-row">
      <button class="btn btn-ghost" id="btn-reveal">👁 再揭示一步</button>
      <button class="btn btn-ghost" id="btn-show-answer">🔓 顯示答案</button>
      <button class="btn btn-primary" id="btn-next" disabled>下一題 ▶</button>
    </div>
  </div>

  <!-- ===== END ===== -->
  <div id="screen-end">
    <h2>🎉 遊戲結束！</h2>
    <p>最終排行榜</p>
    <ul class="leaderboard" id="final-lb"></ul>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn btn-primary" id="btn-play-again">🔄 再玩一次</button>
      <a href="../index.html" class="btn btn-ghost" style="text-decoration:none">← 主選單</a>
    </div>
  </div>

</div>
<script>
// ===================== CONFIG =====================
const cfg = {
  revealSteps: 5,
  maxScore: 10,
  deductPerStep: 1,
  questionsPerRound: 10,
  teams: 2,
  teamNames: ['隊伍 1', '隊伍 2']
};
const TEAM_COLORS = ['#f5c542','#3498db','#e94560','#2ecc71','#9b59b6','#e67e22'];

// ===================== STATE =====================
let images = [];
let queue = [];
let qIdx = 0, currentStep = 0, totalSteps = 5, revealed = false, scored = false;
let maxScore = 10, currentPts = 10;
let pendingFile = null, pendingEditIdx = null;
let timerInterval = null;

// ===================== PILL HELPER =====================
function initPills(groupId, cfgKey) {
  document.getElementById(groupId).querySelectorAll('.option-pill').forEach(p => {
    p.addEventListener('click', function() {
      document.getElementById(groupId).querySelectorAll('.option-pill').forEach(x => x.classList.remove('sel'));
      this.classList.add('sel');
      cfg[cfgKey] = Number(this.dataset.val);
      if (cfgKey === 'teams') renderTeamInputs(cfg.teams);
    });
  });
}
initPills('steps-opts', 'revealSteps');
initPills('score-opts', 'maxScore');
initPills('deduct-opts', 'deductPerStep');
initPills('q-opts', 'questionsPerRound');
initPills('team-count-opts', 'teams');

function renderTeamInputs(n) {
  cfg.teams = n;
  document.getElementById('team-name-inputs').innerHTML = Array.from({length:n}, (_,i) => `
    <div class="team-input-row" style="margin-top:10px;">
      <div class="team-color-dot" style="background:${TEAM_COLORS[i]}"></div>
      <input class="team-name-input" type="text" placeholder="隊伍 ${i+1}" value="${cfg.teamNames[i]||'隊伍 '+(i+1)}" data-ti="${i}"/>
    </div>`).join('');
  document.getElementById('team-name-inputs').querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', function() { cfg.teamNames[+this.dataset.ti] = this.value || '隊伍 '+(+this.dataset.ti+1); });
  });
}
renderTeamInputs(2);

// ===================== IMAGE UPLOAD =====================
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      pendingFile = { dataUrl: e.target.result, answer: '' };
      pendingEditIdx = null;
      openAnswerModal(e.target.result, '');
    };
    reader.readAsDataURL(file);
  });
  fileInput.value = '';
}

function openAnswerModal(src, val) {
  document.getElementById('modal-preview').src = src;
  document.getElementById('modal-answer').value = val;
  document.getElementById('modal-answer').style.borderColor = '';
  document.getElementById('answer-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('modal-answer').focus(), 50);
}

document.getElementById('modal-confirm').addEventListener('click', confirmAnswer);
document.getElementById('modal-answer').addEventListener('keydown', e => { if (e.key === 'Enter') confirmAnswer(); });
document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('answer-modal').classList.add('hidden');
  pendingFile = null; pendingEditIdx = null;
});

function confirmAnswer() {
  const ans = document.getElementById('modal-answer').value.trim();
  if (!ans) { document.getElementById('modal-answer').style.borderColor = '#e94560'; return; }
  if (pendingEditIdx !== null) {
    images[pendingEditIdx].answer = ans;
  } else if (pendingFile) {
    images.push({ ...pendingFile, answer: ans });
  }
  document.getElementById('answer-modal').classList.add('hidden');
  pendingFile = null; pendingEditIdx = null;
  renderQueue();
  document.getElementById('start-btn').disabled = images.length === 0;
}

function renderQueue() {
  document.getElementById('img-count').textContent = '(' + images.length + ' 張)';
  document.getElementById('image-queue').innerHTML = images.map((img, i) => `
    <div class="img-thumb" data-idx="${i}">
      <img src="${img.dataUrl}" alt="img"/>
      <div class="img-answer">${img.answer}</div>
      <div class="img-remove" data-rm="${i}">✕</div>
    </div>`).join('');
  document.getElementById('image-queue').querySelectorAll('.img-thumb').forEach(el => {
    el.addEventListener('click', function(e) {
      const rm = e.target.closest('[data-rm]');
      if (rm) {
        images.splice(+rm.dataset.rm, 1);
        renderQueue();
        document.getElementById('start-btn').disabled = images.length === 0;
        return;
      }
      const idx = +this.dataset.idx;
      pendingEditIdx = idx; pendingFile = null;
      openAnswerModal(images[idx].dataUrl, images[idx].answer);
    });
  });
}

// ===================== START GAME =====================
document.getElementById('start-btn').addEventListener('click', function() {
  const nameInputs = document.getElementById('team-name-inputs').querySelectorAll('input');
  cfg.teamNames = Array.from(nameInputs).map((inp, i) => inp.value.trim() || '隊伍 '+(i+1));
  totalSteps = cfg.revealSteps;
  maxScore = cfg.maxScore;

  // Shuffle queue
  queue = [...images].sort(() => Math.random() - 0.5);
  if (cfg.questionsPerRound !== 999) queue = queue.slice(0, cfg.questionsPerRound);
  qIdx = 0;

  // Init scores
  window.scores = new Array(cfg.teams).fill(0);

  showScreen('game');
  loadQuestion();
});

// ===================== GAME LOGIC =====================
const canvas = document.getElementById('pixel-canvas');
const ctx = canvas.getContext('2d');

function loadQuestion() {
  if (qIdx >= queue.length) { endGame(); return; }
  currentStep = 0;
  revealed = false;
  scored = false;
  totalSteps = cfg.revealSteps;
  currentPts = cfg.maxScore;

  document.getElementById('q-counter').textContent = '第 ' + (qIdx+1) + '/' + queue.length + ' 題';
  document.getElementById('reveal-stage').textContent = '像素 0/' + totalSteps;
  document.getElementById('hint-box').textContent = '';
  document.getElementById('answer-overlay').classList.remove('show');
  document.getElementById('btn-next').disabled = true;
  document.getElementById('pts-badge').textContent = '+' + cfg.maxScore;
  document.getElementById('pts-badge').style.background = 'var(--accent)';
  document.getElementById('reveal-bar').style.width = '0%';

  renderScoreBar();
  drawPixelated(queue[qIdx].dataUrl, getPixelSize(0));
  renderTeamBtns();
}

function getPixelSize(step) {
  const ratio = 1 - (step / totalSteps);
  return Math.max(1, Math.round(64 * Math.pow(ratio, 1.5)));
}

function drawPixelated(src, blockSize) {
  const img = new Image();
  img.onload = function() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    if (blockSize <= 1) {
      ctx.drawImage(img, 0, 0, W, H);
    } else {
      const offW = Math.ceil(W / blockSize), offH = Math.ceil(H / blockSize);
      const off = document.createElement('canvas');
      off.width = offW; off.height = offH;
      const octx = off.getContext('2d');
      octx.imageSmoothingEnabled = false;
      octx.drawImage(img, 0, 0, offW, offH);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, W, H);
    }
  };
  img.src = src;
}

function getCurrentPts() {
  return Math.max(0, cfg.maxScore - currentStep * cfg.deductPerStep);
}

document.getElementById('btn-reveal').addEventListener('click', function() {
  if (revealed) return;
  if (currentStep >= totalSteps) { revealAnswer(); return; }
  currentStep++;
  drawPixelated(queue[qIdx].dataUrl, getPixelSize(currentStep));
  const pts = getCurrentPts();
  document.getElementById('pts-badge').textContent = pts > 0 ? '+'+pts : '0';
  document.getElementById('pts-badge').style.background = pts > 0 ? 'var(--accent)' : 'rgba(255,255,255,.15)';
  document.getElementById('reveal-stage').textContent = '像素 ' + currentStep + '/' + totalSteps;
  document.getElementById('reveal-bar').style.width = (currentStep/totalSteps*100) + '%';
  renderTeamBtns();
  playBeep();
  if (currentStep >= totalSteps) setTimeout(revealAnswer, 400);
});

document.getElementById('btn-show-answer').addEventListener('click', revealAnswer);

document.getElementById('btn-next').addEventListener('click', function() {
  qIdx++;
  loadQuestion();
});

function revealAnswer() {
  if (revealed) return;
  revealed = true;
  document.getElementById('answer-display').textContent = queue[qIdx].answer;
  document.getElementById('answer-overlay').classList.add('show');
  drawPixelated(queue[qIdx].dataUrl, 1);
  document.getElementById('btn-next').disabled = false;
  document.getElementById('reveal-bar').style.width = '100%';
  document.getElementById('reveal-stage').textContent = '✅ 已揭示';
  renderTeamBtns();
}

function renderTeamBtns() {
  const pts = getCurrentPts();
  document.getElementById('team-btns').innerHTML = cfg.teamNames.map((name, i) => `
    <button class="team-score-btn"
      style="background:${TEAM_COLORS[i]};color:${i===0?'#1a1a00':'#fff'}"
      ${scored?'disabled':''} data-team="${i}">
      ${name} <span style="background:rgba(0,0,0,.2);padding:3px 8px;border-radius:6px;margin-left:6px;font-size:14px">+${pts}</span>
    </button>`).join('');
  document.getElementById('team-btns').querySelectorAll('.team-score-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      if (scored) return;
      const ti = +this.dataset.team;
      const pts = getCurrentPts();
      window.scores[ti] = (window.scores[ti] || 0) + pts;
      scored = true;
      if (!revealed) revealAnswer();
      renderTeamBtns();
      renderScoreBar();
      playCorrect();
    });
  });
}

function renderScoreBar() {
  document.getElementById('score-bar').innerHTML = cfg.teamNames.map((name, i) => `
    <div class="score-chip">
      <span class="dot" style="background:${TEAM_COLORS[i]}"></span>
      <span>${name}</span>
      <span style="color:var(--primary);font-weight:900;margin-left:4px">${window.scores?.[i]||0}</span>
    </div>`).join('');
}

// ===================== END GAME =====================
function endGame() {
  showScreen('end');
  playFanfare();
  launchConfetti();
  const sorted = cfg.teamNames.map((n,i)=>({n,s:window.scores[i]||0})).sort((a,b)=>b.s-a.s);
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('final-lb').innerHTML = sorted.map((t,i) => `
    <li style="animation:slide-in .4s ${i*.08}s both">
      <span style="font-size:22px">${medals[i]||'🎮'}</span>
      <span class="dot" style="background:${TEAM_COLORS[cfg.teamNames.indexOf(t.n)]}"></span>
      <span>${t.n}</span>
      <span class="lb-score">${t.s}</span>
    </li>`).join('');
}

document.getElementById('btn-play-again').addEventListener('click', function() {
  document.getElementById('start-btn').disabled = images.length === 0;
  showScreen('setup');
});

// ===================== SOUND =====================
function playBeep() {
  try {
    const ctx2 = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx2.createOscillator(), g = ctx2.createGain();
    o.connect(g); g.connect(ctx2.destination);
    o.frequency.setValueAtTime(600, ctx2.currentTime);
    o.frequency.linearRampToValueAtTime(900, ctx2.currentTime+0.15);
    g.gain.setValueAtTime(0.15, ctx2.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime+0.25);
    o.start(); o.stop(ctx2.currentTime+0.25);
  } catch(e){}
}
function playCorrect() {
  try {
    const ctx2 = new (window.AudioContext||window.webkitAudioContext)();
    [[523,0],[784,0.12]].forEach(([f,d])=>{
      const o=ctx2.createOscillator(),g=ctx2.createGain();
      o.connect(g);g.connect(ctx2.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(0.2,ctx2.currentTime+d);
      g.gain.exponentialRampToValueAtTime(0.001,ctx2.currentTime+d+0.3);
      o.start(ctx2.currentTime+d);o.stop(ctx2.currentTime+d+0.3);
    });
  } catch(e){}
}
function playFanfare() {
  try {
    const ctx2=new(window.AudioContext||window.webkitAudioContext)();
    [[523,0],[659,.12],[784,.24],[1047,.36]].forEach(([f,d])=>{
      const o=ctx2.createOscillator(),g=ctx2.createGain();
      o.connect(g);g.connect(ctx2.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(0.2,ctx2.currentTime+d);
      g.gain.exponentialRampToValueAtTime(0.001,ctx2.currentTime+d+0.35);
      o.start(ctx2.currentTime+d);o.stop(ctx2.currentTime+d+0.35);
    });
  } catch(e){}
}

// ===================== CONFETTI =====================
function launchConfetti() {
  const colors=['#f5c542','#e94560','#3498db','#2ecc71','#9b59b6','#e67e22'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;
      width:${7+Math.random()*7}px;height:${7+Math.random()*7}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random()>.5?'50%':'2px'};
      animation:confetti-fall ${1.5+Math.random()*2}s ${Math.random()*.5}s forwards;
      z-index:9999;pointer-events:none;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}

// ===================== UTILS =====================
function showScreen(name) {
  ['screen-setup','screen-game','screen-end'].forEach(id=>{
    const el=document.getElementById(id);
    el.style.display = id==='screen-'+name ? 'block' : 'none';
  });
}
</script>
